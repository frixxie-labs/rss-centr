[package]
name = "rss-centr-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
utoipa = { version = "6.0.0", features = ["chrono"] }

[dev-dependencies]
quickcheck = "1"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
