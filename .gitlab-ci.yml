stages:
  - build
  - test
  - deploy

build-backend:
  stage: build
  image: "rust:latest"
  script:
    - rustc --version && cargo --version
    - cargo build --workspace --verbose
  variables:
    SQLX_OFFLINE: 1

build-frontend:
  stage: build
  image: "rust:trixie"
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall -y --locked dioxus-cli@^0.7
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add wasm32-unknown-unknown
  script:
    - cd frontend-dioxus
    - dx build --web --release --profile wasm-release --package rss-centr-frontend --no-default-features --locked
  artifacts:
    paths:
      - target/dx/rss-centr-frontend/release/web/

test-backend:
  stage: test
  image: "rust:latest"
  services:
    - name: "pgvector/pgvector:pg18"
      alias: postgres
  before_script:
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U postgres; do sleep 1; done
  script:
    - rustc --version && cargo --version
    - cargo test --workspace --verbose
  variables:
    POSTGRES_DB: "rss_centr"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/rss_centr"
    SQLX_OFFLINE: 1

test-frontend:
  stage: test
  image: "rust:trixie"
  needs:
    - build-frontend
  before_script:
    - rustup target add wasm32-unknown-unknown
    - cd frontend-dioxus
  script:
    - cargo fmt --all -- --check
    - cargo clippy -p rss-centr-frontend --all-targets --all-features -- -D warnings
    - cargo test -p rss-centr-frontend --features server --locked
    - cargo check -p rss-centr-frontend --no-default-features --features web --target wasm32-unknown-unknown

deploy-backend:
  stage: deploy
  tags:
    - docker-build
  image:
    name: quay.io/buildah/stable:latest
    entrypoint: [""]
  variables:
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  script:
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - buildah build
      --file backend/Dockerfile
      --tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      .
    - buildah push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG

deploy-frontend:
  stage: deploy
  tags:
    - docker-build
  image:
    name: quay.io/buildah/stable:latest
    entrypoint: [""]
  variables:
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  script:
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - buildah build
      --file frontend-dioxus/Dockerfile
      --tag "${CI_REGISTRY_IMAGE}:frontend-${CI_COMMIT_TAG}"
      .
    - buildah push "${CI_REGISTRY_IMAGE}:frontend-${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG

deploy-worker:
  stage: deploy
  tags:
    - docker-build
  image:
    name: quay.io/buildah/stable:latest
    entrypoint: [""]
  variables:
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  script:
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - buildah build
      --file worker/Dockerfile
      --tag "${CI_REGISTRY_IMAGE}:worker-${CI_COMMIT_TAG}"
      .
    - buildah push "${CI_REGISTRY_IMAGE}:worker-${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
