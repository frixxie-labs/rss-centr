name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-backend:
    name: Build backend
    runs-on: arc-frixxie-runner
    container:
      image: rust:latest
    env:
      SQLX_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Rust versions
        run: rustc --version && cargo --version

      - name: Build backend
        run: cargo build --manifest-path backend/Cargo.toml --verbose

      - name: Build worker
        run: cargo build --manifest-path worker/Cargo.toml --verbose

  test-backend:
    name: Test backend
    needs: build-backend
    runs-on: arc-frixxie-runner
    container:
      image: rust:latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: rss_centr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d rss_centr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rss_centr
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Rust versions
        run: rustc --version && cargo --version

      - name: Run tests
        run: cargo test --workspace --verbose

  build-frontend:
    name: Build frontend
    runs-on: arc-frixxie-runner
    container:
      image: rust:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-leptos and WASM target
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-leptos@^0.3
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add wasm32-unknown-unknown

      - name: Build frontend
        working-directory: frontend
        run: cargo leptos build --release --cargo-locked

      - uses: actions/upload-artifact@v6
        with:
          name: frontend-production
          path: |
            target/release/rss-centr-frontend
            target/site/

  test-frontend:
    name: Test frontend
    needs: build-frontend
    runs-on: arc-frixxie-runner
    container:
      image: rust:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check frontend
        working-directory: frontend
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy -p rss-centr-frontend --all-targets -- -D warnings
          rustup target add wasm32-unknown-unknown
          cargo clippy -p rss-centr-frontend --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        run: cargo test -p rss-centr-frontend --locked

  deploy-backend:
    name: Deploy backend image
    needs:
      - test-backend
      - test-frontend
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  deploy-frontend:
    name: Deploy frontend image
    needs:
      - test-backend
      - test-frontend
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/frontend"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  deploy-worker:
    name: Deploy worker image
    needs:
      - test-backend
      - test-frontend
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/worker"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
