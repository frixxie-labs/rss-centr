[package]
name = "rss-centr-frontend"
version = "0.1.0"
edition = "2024"

[features]
default = []
web = ["dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:gloo-timers", "dep:futures-channel"]
server = ["dioxus/server", "dep:tokio", "dep:tracing-subscriber", "dep:tower-http"]

[dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
tower-http = { version = "0.6", features = ["trace", "compression-br", "compression-gzip"], optional = true }
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "EventSource", "MessageEvent", "Event", "EventTarget", "Element", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
futures-channel = { version = "0.3", optional = true }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-stream = "0.3"
