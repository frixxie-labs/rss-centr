[workspace]
members = ["backend", "core", "worker", "frontend"]
resolver = "3"

# Size-optimised profile for the Leptos WASM bundle (`lib-profile-release` in frontend/Cargo.toml).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
# No `strip`: it removes the `__wasm_bindgen_unstable` section wasm-bindgen needs; wasm-opt shrinks the output instead.
